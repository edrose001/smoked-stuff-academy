<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ED1C24">
<meta name="description" content="Sales training for new SmokED Stuff booth employees.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SmokED Academy">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>SmokED Stuff Sales Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a golf scorecard across the top (one cell per lesson = "hole"), one hole shown at a time below in a single reading column. */
:root{
  --paper:#F2F4EF; --card:#FFFFFF; --ink:#2A231E; --muted:#66655C; --line:#D6DACF;
  --fairway:#2E6A44; --fairway-soft:#E1EDE3; --flag:#C9951F; --flag-soft:#F7ECCF;
  --bad:#A4402C; --bad-soft:#F6E2DC;
  --display:"Zilla Slab",Georgia,serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#161915; --card:#1F231E; --ink:#ECEBE3; --muted:#A2A598; --line:#353B33;
  --fairway:#72BC8C; --fairway-soft:#22352A; --flag:#E2B44A; --flag-soft:#3A3120;
  --bad:#E68168; --bad-soft:#3D2620; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#161915; --card:#1F231E; --ink:#ECEBE3; --muted:#A2A598; --line:#353B33;
  --fairway:#72BC8C; --fairway-soft:#22352A; --flag:#E2B44A; --flag-soft:#3A3120;
  --bad:#E68168; --bad-soft:#3D2620; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:24px 64px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,5vw,40px)}
h2{font-size:clamp(24px,4vw,32px)}
h3{font-size:21px}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
header.top{display:flex;flex-direction:column;gap:6px;margin-bottom:20px}
header.top p{color:var(--muted);max-width:60ch}

/* scorecard */
.scorecard{overflow-x:auto;border:2px solid var(--ink);border-radius:4px;background:var(--card);margin-bottom:28px}
.scorecard table{border-collapse:collapse;width:100%;min-width:640px;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.scorecard th,.scorecard td{border:1px solid var(--line);padding:6px 4px;text-align:center}
.scorecard th:first-child,.scorecard td:first-child{text-align:left;padding-left:10px;width:88px;color:var(--muted);font-weight:500}
.scorecard button{all:unset;cursor:pointer;display:block;width:100%;padding:2px 0;border-radius:3px}
.scorecard button:focus-visible{outline:2px solid var(--fairway);outline-offset:1px}
.scorecard .cur{background:var(--fairway-soft)}
.scorecard .cur button{font-weight:700;color:var(--fairway)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--line);vertical-align:middle}
.dot.on{background:var(--fairway);border-color:var(--fairway)}
.tot{font-weight:700;color:var(--fairway)}

/* hole */
.hole{display:flex;flex-direction:column;gap:22px}
.hole-head{display:flex;flex-direction:column;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:14px}
.hole-head .goal{color:var(--muted)}
.tee{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap}
.tee-hole,.tee-par{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:6px;padding:6px 16px;min-width:84px}
.tee-hole{background:var(--fairway);color:var(--card)}
.tee-par{background:var(--card);color:var(--ink);border:2px solid var(--ink)}
.tee span:not(.tee-of){font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.tee b{font-family:var(--display);font-size:44px;line-height:1}
.tee-of{align-self:flex-end;font-family:var(--mono);font-size:13px;color:var(--muted)}
section.block{display:flex;flex-direction:column;gap:12px}
ul.plain{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.say{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--fairway);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.say .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--fairway)}
.say q{quotes:none;font-size:19px;font-weight:700}
.say q::before{content:"\201C"}.say q::after{content:"\201D"}
h3.part{font-size:26px;border-bottom:1px solid var(--line);padding-bottom:6px}
.fill{display:inline-block;font-family:var(--mono);font-size:.8em;font-weight:500;text-transform:uppercase;letter-spacing:.06em;border:2px dashed var(--fairway);color:var(--fairway);border-radius:4px;padding:0 8px;line-height:1.5}
.fill::before{content:"\270E  "}
.cert-wait{border:2px dashed var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:6px}
.cert-done{display:flex;flex-direction:column;gap:12px}
.cert{background:#FFFFFF;color:#2A231E;border:10px solid #2E6A44;border-radius:4px;padding:8px}
.cert-in{border:2px solid #C9951F;padding:28px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.cert-brand{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#66655C}
.cert-title{font-family:var(--display);font-weight:700;font-size:clamp(32px,7vw,52px);color:#2E6A44;line-height:1.1}
.cert-small{font-size:15px;color:#66655C;max-width:46ch}
.cert-name{font-family:var(--display);font-weight:700;font-size:clamp(28px,6vw,42px);border-bottom:2px solid #C9951F;padding:0 24px 4px;overflow-wrap:anywhere}
.cert-foot{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;width:100%;margin-top:14px}
.cert-foot div{display:flex;flex-direction:column;gap:2px;border-top:1px solid #2A231E;padding-top:6px;min-width:0}
.cert-foot b{font-size:15px;overflow-wrap:anywhere}
.cert-foot span{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#66655C}
.why{border:1px dashed var(--muted);border-radius:4px;padding:12px 16px;display:flex;flex-direction:column;gap:6px;background:var(--paper)}
.why .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.why p{font-size:16px}
.do{background:var(--flag-soft);border:1px solid var(--flag);border-left:5px solid var(--flag);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.do .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.do .act{font-size:19px;font-weight:700;display:flex;gap:10px;align-items:baseline}
.do .act::before{content:"\25B6";font-size:14px;color:var(--flag)}
.rule{background:var(--flag-soft);border:1px solid var(--flag);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.rule .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.rule strong{font-family:var(--display);font-size:22px}
.twocol{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.good,.avoid{border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.good{background:var(--fairway-soft)}
.avoid{background:var(--bad-soft)}
.good .lbl{color:var(--fairway)}.avoid .lbl{color:var(--bad)}
.good .lbl,.avoid .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:18px;counter-reset:s}
.steps>li{display:grid;grid-template-columns:40px 1fr;gap:12px;counter-increment:s}
.steps>li::before{content:counter(s);font-family:var(--display);font-size:22px;font-weight:700;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center}
.steps>li{position:relative}
.steps>li:not(:last-child)::after{content:"";position:absolute;left:19px;top:44px;bottom:-16px;width:2px;background:var(--ink);opacity:.35}
.step-of{color:var(--fairway);font-weight:500}
.steps>li>div{display:flex;flex-direction:column;gap:10px;min-width:0}

/* products */
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.prod{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.prod h3{font-size:20px}
.prod .id{font-family:var(--mono);font-size:12px;color:var(--fairway);text-transform:uppercase;letter-spacing:.08em}
.prod .tag{display:inline-block;font-family:var(--mono);font-size:11px;background:var(--flag-soft);border:1px solid var(--flag);border-radius:20px;padding:0 8px;margin-right:4px}
.prod small{color:var(--muted);font-size:14px}
.prod .tp{font-style:italic;font-size:15px}
.found{display:flex;flex-wrap:wrap;gap:8px}
.found span{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:15px}

table.route{border-collapse:collapse;width:100%;min-width:480px;font-size:16px}
.tablebox{overflow-x:auto}
table.route th,table.route td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}
table.route th{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
table.route td:first-child{font-weight:700;white-space:nowrap}
.price{font-variant-numeric:tabular-nums}
.price td:last-child{font-family:var(--mono);text-align:right}

/* games and quiz */
.panel{background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:14px}
.panel h3{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.panel h3 .score{font-family:var(--mono);font-size:14px;color:var(--muted)}
.clue{font-size:19px;font-weight:700}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.btn{font:inherit;font-weight:700;cursor:pointer;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:4px;padding:10px 14px;text-align:left}
.btn:hover{background:var(--fairway-soft)}
.btn:focus-visible{outline:3px solid var(--fairway);outline-offset:2px}
.btn.primary{background:var(--fairway);border-color:var(--fairway);color:var(--card);text-align:center}
.btn.primary:hover{filter:brightness(1.08)}
.btn.right{background:var(--fairway-soft);border-color:var(--fairway)}
.btn.wrong{background:var(--bad-soft);border-color:var(--bad)}
.btn:disabled{cursor:default}
.btn.primary:disabled{opacity:.4;cursor:not-allowed}
.ahead-banner{background:var(--flag-soft);border:1px solid var(--flag);border-radius:4px;padding:12px 16px}
.panel.ahead{border-style:dashed}
.next-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.scorecard .locked button{opacity:.5}
.q{display:flex;flex-direction:column;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.q:last-of-type{border-bottom:0}
.q legend{font-weight:700;padding:0;margin-bottom:6px}
.q fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.q label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:6px 8px;border-radius:4px}
.q label:hover{background:var(--fairway-soft)}
.q input{margin-top:5px;accent-color:var(--fairway)}
.fb{font-size:15px;border-radius:4px;padding:6px 10px}
.fb.ok{background:var(--fairway-soft);color:var(--fairway)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.result{font-family:var(--display);font-size:22px}
.nb-list{margin:0;padding-left:26px;display:flex;flex-direction:column;gap:12px}
.nb-row{display:grid;grid-template-columns:1fr minmax(170px,220px);gap:6px 12px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.nb-row .clue{font-size:17px;min-width:0}
.nb-row .fb{grid-column:1/-1}
.nb-row select{font:inherit;font-weight:700;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:4px;padding:8px 10px;width:100%}
.nb-row select.right{border-color:var(--fairway);background:var(--fairway-soft)}
.nb-row select.wrong{border-color:var(--bad);background:var(--bad-soft)}
.nb-btns{display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:560px){.nb-row{grid-template-columns:1fr}}
#mulligan-btn,#reset-btn{display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.2;text-align:center}
.b-sub{font-size:12px;font-weight:400;color:var(--muted)}
.jump{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.jump select{font:inherit;font-weight:700;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:4px;padding:8px 10px;max-width:100%}
.reset-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.reset-confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bad-soft);border:1px solid var(--bad);border-radius:4px;padding:8px 12px}
.btn.small{padding:6px 12px;font-size:15px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--card)}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:2px solid var(--ink);padding-top:16px}

/* certification */
.lvl{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:10px}
.lvl.done{border:2px solid var(--fairway)}
.lvl .chk{display:flex;gap:10px;align-items:flex-start}
.lvl .chk input{margin-top:6px;width:18px;height:18px;accent-color:var(--fairway)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
input[type=text],input[type=date]{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:8px 10px}
.badge{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.1em;padding:2px 10px;border-radius:20px;align-self:flex-start}
.badge.on{background:var(--fairway);color:var(--card)}
.badge.off{background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.note{font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.hole{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
</style>

<div class="wrap">
  <header class="top">
    <span class="eyebrow">New employee training</span>
    <h1>SmokED Stuff Sales Academy</h1>
    <p>Nine holes. Play them in order. Pass the quiz on each hole to mark your scorecard. Your trainer signs off on Hole 9.</p>
  </header>

  <div class="scorecard" aria-label="Your progress">
    <table>
      <thead><tr id="sc-holes"><th>Hole</th></tr></thead>
      <tbody>
        <tr id="sc-names"><td>Lesson</td></tr>
        <tr id="sc-par"><td>Par</td></tr>
        <tr id="sc-score"><td>Quiz</td></tr>
        <tr id="sc-done"><td>Done</td></tr>
      </tbody>
    </table>
  </div>

  <main id="main"></main>
</div>

<script>
/* ---------- data ---------- */
const PRODUCTS = [
  {name:"Bunker", id:"Signature all-purpose", ing:["Smoked garlic","Smoked sea salt","Smoked black pepper"], best:"Steak, burgers, eggs, salads, vegetables, chicken", tp:"This has the smoked garlic, salt, and pepper you just smelled. It's our most versatile seasoning."},
  {name:"Birdie", id:"Memphis-style poultry", ing:["Paprika","Brown sugar","Molasses","Onion"], best:"Chicken, turkey, wings", tp:"Classic Memphis BBQ flavor."},
  {name:"Driver", id:"Latin-inspired", ing:["Cumin","Cilantro","Chipotle"], tags:["Salt-free","Sugar-free"], best:"Chicken, seafood, vegetables, fajitas", tp:"Latin-inspired with no salt and no sugar."},
  {name:"Tee Box", id:"Lemon pepper", ing:["Lemon oil","Smoked black pepper","Corn meal"], best:"Chicken, fish, shrimp, vegetables", tp:"The corn meal adds texture and crunch."},
  {name:"Caddie", id:"Jalapeño lime", ing:["Jalapeño","Lime","Sea salt","Cumin"], best:"Chicken, shrimp, fish tacos, vegetables", tp:"Bright citrus with a mild kick."},
  {name:"Par", id:"Kansas City BBQ", ing:["Brown sugar","Paprika","Garlic","Salt","Pepper"], best:"Ribs, pork butt, pulled pork, pork loin", tp:"Traditional Kansas City style pork rub."},
  {name:"Honey Putter", id:"Sweet honey pork", ing:["Honey granules","Celery seed","Paprika","Garlic"], best:"Pork butt, pork tenderloin, ribs, chicken, salmon", tp:"If you like a sweeter pork profile, this is usually the one people fall in love with."},
  {name:"Texas Wedge", id:"Texas steakhouse", ing:["Ancho chili powder","Coffee","Cocoa","Cayenne"], best:"Steak, brisket, burgers, beef ribs", tp:"The coffee and cocoa build incredible depth and crust."},
  {name:"Pitching Wedge", id:"Southwest steak", ing:["Salt","Pepper","Garlic","Chili powder","Cumin","Chipotle"], best:"Steak, burgers, beef", tp:"A Southwest flavor with smoky chipotle notes."}
];

const Q = {
  1:[
    {q:"What is our real job at the booth?", a:"Help people cook better food", w:["Sell as many bottles as we can","Explain how our smoker works"], why:"Teach first. Sell second."},
    {q:"Which of the following lists all the smoked spices we carry?", a:"Garlic, sea salt, black pepper, paprika, onion, brown sugar", w:["Cumin, cilantro, chipotle, lime, cocoa, coffee","Honey, lemon, celery seed, cayenne, molasses, corn meal"], why:"Smoke comes first. We have six smoked products, and our blends are built on them."},
    {q:"Which line is OK to say?", a:"\"We have smoked salt, pepper, and garlic.\"", w:["\"We smoke everything ourselves.\"","\"We make this in our smoker.\""], why:"Talk about what the product is, not how it's made."},
    {q:"Finish the clean label line: all-natural, gluten-free, non-GMO, and...", a:"Contains no MSG", w:["Certified organic","Low fat"], why:"Never add claims that are not on the label. We do not say organic or low fat."},
    {q:"Why do we teach before we sell?", a:"A customer who learned something trusts the person who taught them", w:["Teaching makes the sale take longer","Customers expect a class"], why:"People don't like being sold to, but they love learning."},
    {q:"What happens if a customer catches one claim that isn't true?", a:"They doubt everything else you say", w:["Nothing, if the rest is true","They ask for a discount"], why:"Trust takes a long time to build and one false claim to lose."},
    {q:"In the golden rule, what comes last?", a:"The wallet. Price comes once they already want it", w:["The nose","The imagination"], why:"Nose first, imagination second, wallet third."}
  ],
  2:[
    {q:"A customer looks like they aren't stopping. What do you say?", a:"\"Smells are free today!\"", w:["\"Wait, come back!\"","Nothing. Let them go"], why:"A little humor shows there is no pressure. A laugh often turns a walk-by into a stop."},
    {q:"What do you hand the customer first?", a:"The smoked garlic", w:["Bunker","The price sheet"], why:"Garlic first. It gets the biggest \"wow.\""},
    {q:"How do you dry brine a steak?", a:"Season it the night before and leave it uncovered in the fridge", w:["Soak it in salt water for an hour","Salt it after it comes off the grill"], why:"Uncovered in the fridge overnight. The salt soaks in and the surface dries."},
    {q:"What does dry brining give the customer?", a:"Deeper flavor and a better crust", w:["A shorter cook time","A sweeter taste"], why:"Flavor goes in. The dry surface sears into a better crust."},
    {q:"You just asked, \"What do you like to cook the most?\" Now what?", a:"Stop talking and listen", w:["List all nine blends","Tell them the prices"], why:"Their answer tells you which bottles to show."},
    {q:"Why do you name uses right after the \"wow\"?", a:"To turn surprise into \"I could use this\"", w:["To fill the silence","To get to the price faster"], why:"Going from surprise to usefulness is how a sale happens."},
    {q:"Why do we tell the story after the smells, not before?", a:"A story told after the experience gets believed", w:["It's shorter that way","Customers ask for the story first"], why:"Told before, it sounds like a pitch. After, it gives a name to what they just smelled."},
    {q:"Why teach dry brining for free?", a:"Giving something first builds trust and makes people want to give back", w:["To make the talk longer","To show off what we know"], why:"You become the expert, not just the person selling."},
    {q:"What is the right order?", a:"Garlic, salt, story, Bunker, ask", w:["Bunker, garlic, prices, ask","Ask, prices, Bunker, salt"], why:"The garlic and salt set up Bunker. Then you ask."}
  ],
  3:[
    {q:"Which blend is salt-free and sugar-free?", a:"Driver", w:["Caddie","Par"], why:"Driver: cumin, cilantro, chipotle. No salt, no sugar."},
    {q:"Which blend has coffee and cocoa?", a:"Texas Wedge", w:["Pitching Wedge","Bunker"], why:"Texas Wedge: ancho, coffee, cocoa, cayenne."},
    {q:"Which blend uses corn meal for crunch?", a:"Tee Box", w:["Birdie","Honey Putter"], why:"Tee Box is our lemon pepper. The corn meal adds texture."},

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ---------- scorecard ---------- */
function renderCard(){
  const h=$("#sc-holes"),n=$("#sc-names"),d=$("#sc-done"),sc=$("#sc-score"),pr=$("#sc-par");
  S.scores=S.scores||{};
  h.innerHTML="<th>Hole</th>";n.innerHTML="<td>Lesson</td>";d.innerHTML="<td>Done</td>";sc.innerHTML="<td>Quiz</td>";pr.innerHTML="<td>Par</td>";
  HOLES.forEach(x=>{
    const c=x.n===S.cur?' class="cur"':"";
    const lk="";const cl=(x.n===S.cur?"cur":"")+(unlocked(x.n)?"":" locked");const c2=cl?` class="${cl.trim()}"`:"";
    h.insertAdjacentHTML("beforeend",`<th${c2}><button data-go="${x.n}"${lk} aria-label="Go to hole ${x.n}, ${x.title}">${x.n}</button></th>`);
    n.insertAdjacentHTML("beforeend",`<td${c2}><button data-go="${x.n}" tabindex="-1"${lk}>${x.short}</button></td>`);
    let v="–";
    if(x.n===9){const l=CERT.filter(z=>z.items.every((_,i)=>(S.cert[z.lvl]||{})["i"+i])).length;v=l?`${l}/4 lvls`:"–";}
    else if(S.scores[x.n])v=`${S.scores[x.n].r}/${S.scores[x.n].t}`;
    sc.insertAdjacentHTML("beforeend",`<td${c}>${v}</td>`);
    pr.insertAdjacentHTML("beforeend",`<td${c}>${x.par}</td>`);
    d.insertAdjacentHTML("beforeend",`<td${c}><span class="dot${S.done[x.n]?" on":""}" title="${S.done[x.n]?"Passed":"Not yet"}"></span></td>`);
  });
  const total=HOLES.filter(x=>S.done[x.n]).length;
  d.insertAdjacentHTML("beforeend","");
  h.insertAdjacentHTML("beforeend",`<th>Total</th>`);
  n.insertAdjacentHTML("beforeend",`<td></td>`);
  sc.insertAdjacentHTML("beforeend",`<td></td>`);
  pr.insertAdjacentHTML("beforeend",`<td class="tot">${HOLES.reduce((t,x)=>t+x.par,0)}</td>`);
  d.insertAdjacentHTML("beforeend",`<td class="tot">${total}/9</td>`);
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b){go(+b.dataset.go);}});
function unlocked(n){for(let k=1;k<n&&k<9;k++){if(!S.done[k])return false;}return true;}
function frontier(){for(let k=1;k<9;k++){if(!S.done[k])return k;}return 9;}
function go(n){S.cur=n;save();renderCard();renderHole();window.scrollTo({top:0,behavior:"smooth"});}

/* ---------- quiz ---------- */
function quiz(holeN,list,{pass,label="Hole quiz"}={}){
  if(!unlocked(holeN))return `<div class="panel ahead"><h3>${label}<span class="score">Locked</span></h3><p>This quiz unlocks after you pass Hole ${frontier()}. Read ahead all you like.</p><button class="btn" type="button" data-go="${frontier()}">Go to Hole ${frontier()}</button></div>`;
  const id="qz"+holeN;
  const items=list.map((it,i)=>({...it,opts:shuffle([it.a,...it.w]),i}));
  pass=pass??items.length;
  const html=`<div class="panel" id="${id}"><h3>${label}<span class="score">Pass: ${pass} of ${items.length}</span></h3>
  ${items.map(it=>`<div class="q"><fieldset><legend>${it.i+1}. ${esc(it.q)}</legend>
    ${it.opts.map((o,k)=>`<label><input type="radio" name="${id}-${it.i}" id="${id}-${it.i}-${k}" value="${esc(o)}"> <span>${esc(o)}</span></label>`).join("")}
  </fieldset><div class="fb" hidden></div></div>`).join("")}
  <button class="btn primary" type="button">Check my answers</button><p class="result" hidden></p></div>`;
  setTimeout(()=>{
    const root=document.getElementById(id);if(!root)return;
    root.querySelector(".btn.primary").addEventListener("click",()=>{
      let right=0;
      items.forEach(it=>{
        const box=root.querySelectorAll(".q")[it.i];
        const pick=box.querySelector("input:checked");
        const fb=box.querySelector(".fb");fb.hidden=false;
        if(pick&&pick.value===it.a){right++;fb.className="fb ok";fb.textContent="Correct. "+it.why;}
        else{fb.className="fb no";fb.textContent=(pick?"Not quite. ":"Pick an answer. ")+it.why;}
      });
      S.scores=S.scores||{};const prev=S.scores[holeN];
      if(!prev||right>prev.r)S.scores[holeN]={r:right,t:items.length};save();renderCard();
      const r=root.querySelector(".result");r.hidden=false;
      if(right>=pass){r.textContent=`${right} of ${items.length}. In the hole! Your scorecard is marked.`;S.done[holeN]=true;save();renderCard();}
      else r.textContent=`${right} of ${items.length}. Read the notes above and try again.`;
      const nb=document.getElementById("next-btn");if(nb&&unlocked(+nb.dataset.go)){nb.disabled=false;const hn=document.getElementById("next-hint");if(hn)hn.hidden=true;}
    });
  });
  return html;
}

function blendGame(){

      order=shuffle(PRODUCTS);res.hidden=true;root.querySelector(".score").textContent="9 blends";

}

        fb.textContent=ok?`Yes. ${c.deal}.`:(sel.value?"Not quite. Hint: ":"Pick a deal. Hint: ")+c.hint;

  const h=HOLES[S.cur-1];
  $("#main").innerHTML=`<article class="hole"><div class="hole-head"><div class="tee"><div class="tee-hole"><span>Hole</span><b>${h.n}</b></div><div class="tee-par"><span>Par</span><b>${h.par}</b></div><span class="tee-of">${h.n} of 9</span></div><h2>${h.title}</h2></div>
  ${unlocked(h.n)?"":`<div class="ahead-banner"><strong>You're reading ahead.</strong> Look around and learn. The quiz on this hole unlocks after you pass Hole ${frontier()}.</div>`}
  ${BODY[h.n]()}
  <div class="navrow">${h.n>1?`<button class="btn" type="button" data-go="${h.n-1}">← Hole ${h.n-1}</button>`:"<span></span>"}
  <div class="reset-row"><label class="jump" for="jump-sel"><span class="b-sub">Review a hole</span><select id="jump-sel">${HOLES.map(x=>`<option value="${x.n}"${x.n===h.n?" selected":""}>Hole ${x.n}: ${x.title}${unlocked(x.n)?"":" (read ahead)"}</option>`).join("")}</select></label>${h.n<9?`<button class="btn" type="button" id="mulligan-btn" title="Clear this hole's answers and score and try it again"><span class="b-main">Mulligan</span><span class="b-sub">Redo Hole ${h.n} only</span></button>`:""}<button class="btn" type="button" id="reset-btn"><span class="b-main">Start over</span><span class="b-sub">Whole course, Hole 1</span></button>
    <div class="reset-confirm" id="reset-confirm" hidden><span>This clears every hole, your scorecard, names, and trainer sign-offs. Start the whole course over?</span>
      <button class="btn small danger" type="button" id="reset-yes">Yes, start over</button>
      <button class="btn small" type="button" id="reset-no">Cancel</button></div></div>
  ${h.n<9?`<div class="next-wrap"><button class="btn primary" type="button" id="next-btn" data-go="${h.n+1}">Hole ${h.n+1} →</button><span class="note" id="next-hint"${(!unlocked(h.n)||unlocked(h.n+1))?" hidden":""}>You can read ahead. Hole ${h.n+1}'s quiz unlocks after you pass this one.</span></div>`:"<span></span>"}</div></article>`;
  if(h.n===9)wireCert();
}
function wireCert(){
  if(!unlocked(9))document.querySelectorAll("#main .lvl input,#trainee,#trainer").forEach(el=>el.disabled=true);
  ["trainee","trainer"].forEach(k=>$("#"+k).addEventListener("input",e=>{S[k]=e.target.value;save();renderCertificate();}));
  document.querySelectorAll("[data-l]").forEach(cb=>cb.addEventListener("change",()=>{
    const l=cb.dataset.l;S.cert[l]=S.cert[l]||{};S.cert[l]["i"+cb.dataset.i]=cb.checked;
    const c=CERT[l-1];const all=c.items.every((_,i)=>S.cert[l]["i"+i]);
    const box=cb.closest(".lvl");box.classList.toggle("done",all);
    const b=box.querySelector(".badge");b.className="badge "+(all?"on":"off");b.textContent=all?"Certified":"In progress";
    S.done[9]=CERT.every(x=>x.items.every((_,i)=>(S.cert[x.lvl]||{})["i"+i]));save();renderCard();renderCertificate();
  }));
  document.querySelectorAll("[data-date]").forEach(d=>d.addEventListener("change",()=>{const l=d.dataset.date;S.cert[l]=S.cert[l]||{};S.cert[l].date=d.value;save();renderCertificate();}));
  renderCertificate();
}

/* ---------- certificate ---------- */
function allCertified(){return CERT.every(x=>x.items.every((_,i)=>(S.cert[x.lvl]||{})["i"+i]));}
function certDate(){
  const ds=CERT.map(c=>(S.cert[c.lvl]||{}).date).filter(Boolean).sort();
  const d=ds.length?new Date(ds[ds.length-1]+"T12:00:00"):new Date();
  return d.toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"});
}
function renderCertificate(){
  const box=$("#certbox");if(!box)return;
  if(!allCertified()){
    if(S.certId){delete S.certId;save();}
    const n=CERT.filter(x=>x.items.every((_,i)=>(S.cert[x.lvl]||{})["i"+i])).length;
    box.innerHTML=`<div class="cert-wait"><span class="eyebrow">Your certificate</span><p>Your Certified SmokED Stuff Dealer certificate appears here when all 4 levels are certified. <strong>${n} of 4 done.</strong></p></div>`;
    return;
  }
  if(!S.certId){const r=Math.random().toString(36).slice(2,6).toUpperCase();const d=new Date();S.certId=`SS-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}-${r}`;save();}
  const name=S.trainee.trim(),trainer=S.trainer.trim();
  box.innerHTML=`<div class="cert-done"><span class="eyebrow">Course complete</span><h3>You're certified!</h3>
  ${name&&trainer?"":`<p class="fb no">Add the ${!name?"trainee":"trainer"} name above so it shows on the certificate.</p>`}
  <div class="cert" id="cert">
    <div class="cert-in">
      <span class="cert-brand">SmokED Stuff Sales Academy</span>
      <span class="cert-title">Certified SmokED Stuff Dealer</span>
      <span class="cert-small">This certifies that</span>
      <span class="cert-name">${esc(name||"Trainee name")}</span>
      <span class="cert-small">played all 9 holes and passed all 4 levels: Product Knowledge, Sales Process, Product Matching, and Independent Seller.</span>
      <div class="cert-foot">
        <div><b>${esc(trainer||"Trainer name")}</b><span>Trainer</span></div>
        <div><b>${certDate()}</b><span>Date</span></div>
        <div><b>${S.certId}</b><span>Certificate No.</span></div>
      </div>
    </div>
  </div>
  <div class="nb-btns"><button class="btn primary" type="button" id="cert-save">Save certificate</button></div>
  <p class="note" id="cert-msg">Saves a picture of the certificate. Send it to your manager as proof.</p></div>`;
  $("#cert-save").addEventListener("click",saveCertificate);
}
function drawCertificate(){
  const W=1600,H=1100,cv=document.createElement("canvas");cv.width=W;cv.height=H;const g=cv.getContext("2d");
  const ink="#2A231E",green="#2E6A44",gold="#C9951F",muted="#66655C";
  g.fillStyle="#FFFFFF";g.fillRect(0,0,W,H);
  g.strokeStyle=green;g.lineWidth=18;g.strokeRect(30,30,W-60,H-60);
  g.strokeStyle=gold;g.lineWidth=4;g.strokeRect(64,64,W-128,H-128);
  g.textAlign="center";g.fillStyle=muted;
  g.font='500 30px "IBM Plex Mono", monospace';g.fillText("SMOKED STUFF SALES ACADEMY",W/2,190);
  g.fillStyle=green;g.font='700 84px "Zilla Slab", Georgia, serif';g.fillText("Certified SmokED Stuff Dealer",W/2,315);
  g.fillStyle=muted;g.font='400 34px "Atkinson Hyperlegible", sans-serif';g.fillText("This certifies that",W/2,420);
  g.fillStyle=ink;g.font='700 84px "Zilla Slab", Georgia, serif';g.fillText(S.trainee.trim()||"Trainee name",W/2,530);
  g.strokeStyle=gold;g.lineWidth=3;g.beginPath();g.moveTo(400,560);g.lineTo(1200,560);g.stroke();
  g.fillStyle=ink;g.font='400 32px "Atkinson Hyperlegible", sans-serif';
  g.fillText("played all 9 holes and passed all 4 levels:",W/2,630);
  g.fillText("Product Knowledge, Sales Process, Product Matching, and Independent Seller.",W/2,678);
  const cols=[[S.trainer.trim()||"Trainer name","TRAINER"],[certDate(),"DATE"],[S.certId,"CERTIFICATE NO."]];
  cols.forEach((c,i)=>{const x=W/2+(i-1)*440;
    g.fillStyle=ink;g.font='700 36px "Atkinson Hyperlegible", sans-serif';g.fillText(c[0],x,860);
    g.strokeStyle=ink;g.lineWidth=2;g.beginPath();g.moveTo(x-180,885);g.lineTo(x+180,885);g.stroke();
    g.fillStyle=muted;g.font='500 22px "IBM Plex Mono", monospace';g.fillText(c[1],x,920);});
  return new Promise(r=>cv.toBlob(r,"image/png"));
}
async function saveCertificate(){
  const msg=$("#cert-msg");
  try{await document.fonts.ready;}catch(e){}
  const blob=await drawCertificate();
  const filename=`SmokED-Stuff-Certificate-${(S.trainee.trim()||"Trainee").replace(/[^A-Za-z0-9]+/g,"-")}.png`;
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;}catch(e){}
  if(dl){
    try{await dl.save({filename,data:blob});msg.textContent="Saved. Send it to your manager as proof.";}
    catch(err){msg.textContent=err&&err.code==="declined"?"Not saved. Click Save certificate to try again.":"This view can't save files. Take a screenshot of the certificate instead.";}
    return;
  }
  try{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();msg.textContent="Saved to your Downloads folder.";}
  catch(e){msg.textContent="Saving didn't work here. Take a screenshot of the certificate instead.";}
}

document.addEventListener("change",e=>{if(e.target.id==="jump-sel")go(+e.target.value);});
document.addEventListener("click",e=>{
  const bt=e.target.closest("button");const id=bt?bt.id:"";
  if(id==="mulligan-btn"){delete S.scores[S.cur];delete S.done[S.cur];save();renderCard();renderHole();window.scrollTo({top:0,behavior:"smooth"});}
  else if(id==="reset-btn"){$("#reset-confirm").hidden=false;$("#reset-btn").hidden=true;}
  else if(id==="reset-no"){$("#reset-confirm").hidden=true;$("#reset-btn").hidden=false;}
  else if(id==="reset-yes"){S={cur:1,done:{},cert:{},scores:{},trainee:"",trainer:"",v:2};try{localStorage.removeItem(KEY);}catch(e){}go(1);}
});
renderCard();renderHole();
</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(() => {}); });
}
</script>
